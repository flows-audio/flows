<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lowlight · Sound for small films</title>
  <meta name="description" content="A dark portfolio that drives a Flows instrument from its own pads, sliders and visuals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
  <style>
    :root {
      --night: #15121f; --plum: #221c33; --line: #352c4d; --text: #ece6f6; --dim: #a69bbd;
      --amber: #f2a541; --lilac: #b8a6ff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--text); font: 400 1.0625rem/1.6 "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 96px; }
    .masthead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 72px; }
    .masthead strong { font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }
    .masthead span { color: var(--dim); }
    h1 { font-size: clamp(2.4rem, 6.5vw, 4.4rem); line-height: 1; letter-spacing: -.04em; font-weight: 800; margin: 0 0 16px; max-width: 14ch; }
    .lede { color: var(--dim); max-width: 36rem; font-size: 1.15rem; margin: 0 0 56px; }

    .study { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: stretch; }
    .study h2 { font-size: 1.35rem; margin: 0 0 6px; letter-spacing: -.01em; }
    .study p { margin: 0 0 20px; color: var(--dim); }
    canvas { display: block; width: 100%; height: 220px; border-radius: 18px; background: var(--plum); }

    .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .pad {
      appearance: none; font: inherit; color: var(--text); cursor: pointer; aspect-ratio: 1.15;
      border-radius: 14px; border: 1px solid var(--line); background: var(--plum);
      display: flex; align-items: flex-end; justify-content: flex-start; padding: 10px 12px; font-weight: 500;
      touch-action: none; user-select: none; -webkit-user-select: none;
      transition: background 80ms ease, border-color 80ms ease, transform 80ms ease;
    }
    .pad[aria-pressed="true"] { background: var(--amber); color: var(--night); border-color: var(--amber); transform: scale(.97); }
    .pad:focus-visible, input:focus-visible, .start:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }

    .sliders { display: grid; gap: 14px; margin-top: 22px; }
    .sliders label { display: grid; grid-template-columns: 5.5rem 1fr 4.5rem; align-items: center; gap: 12px; color: var(--dim); }
    .sliders output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
    input[type="range"] { accent-color: var(--lilac); width: 100%; }
    .start { appearance: none; font: inherit; font-weight: 700; cursor: pointer; color: var(--night); background: var(--lilac); border: 0; border-radius: 999px; padding: 10px 18px; margin-bottom: 18px; }
    .start[hidden] { display: none; }
    .error { color: var(--amber); }
    @media (max-width: 760px) { .study { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .pad { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header class="masthead"><strong>Lowlight</strong><span>Sound for small films</span></header>
    <h1>Bass that sits under the picture.</h1>
    <p class="lede">Every pad below plays the same Flows instrument my score uses. The page draws its own controls; the engine only makes the sound.</p>

    <section class="study" aria-labelledby="study-title">
      <div>
        <h2 id="study-title">Bass study no. 4</h2>
        <p>Play the riff with the pads, or with keys 1–8.</p>
        <button class="start" type="button" hidden>Turn sound on</button>
        <div class="pads" role="group" aria-label="Bass pads"></div>
        <div class="sliders"></div>
        <p class="error" role="alert" hidden></p>
      </div>
      <canvas aria-label="Spectrum of the bass" role="img"></canvas>
    </section>
  </main>

  <!-- Engine layer only: no elements, the page owns every pixel. -->
  <script type="module">
    import { Flows, formatValue } from 'https://flows-audio.github.io/flows/embed/flows-embed-core.js';

    const pads = document.querySelector('.pads');
    const sliders = document.querySelector('.sliders');
    const start = document.querySelector('.start');
    const error = document.querySelector('.error');
    const riff = ['E1', 'G1', 'A1', 'B1', 'D2', 'E2', 'G2', 'A2'];

    try {
      const flows = await Flows.create({ preset: 'pluck-bass', volume: 0.9 });
      window.flows = flows; // handy for trying the API in the console

      // Sound starts on the first gesture; the button is for keyboard users.
      start.hidden = false;
      // start() rejects if the browser will not play audio; say so instead of failing silently.
      const begin = () => flows.start().catch((problem) => {
        error.hidden = false;
        error.textContent = `Sound could not start: ${problem.message}`;
      });
      start.addEventListener('click', begin);
      flows.on('state', ({ state }) => { start.hidden = state === 'running'; });

      riff.forEach((note, index) => {
        const pad = document.createElement('button');
        pad.type = 'button';
        pad.className = 'pad';
        pad.textContent = note;
        pad.setAttribute('aria-pressed', 'false');
        pad.setAttribute('aria-keyshortcuts', String(index + 1));
        const down = () => { begin(); flows.noteOn(note, 0.9); pad.setAttribute('aria-pressed', 'true'); };
        const up = () => { flows.noteOff(note); pad.setAttribute('aria-pressed', 'false'); };
        pad.addEventListener('pointerdown', (event) => { down(); pad.setPointerCapture(event.pointerId); });
        pad.addEventListener('pointerup', up);
        pad.addEventListener('pointercancel', up);
        pad.addEventListener('keydown', (event) => { if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) { event.preventDefault(); down(); } });
        pad.addEventListener('keyup', (event) => { if (event.key === ' ' || event.key === 'Enter') up(); });
        pads.append(pad);
      });
      const padFor = (key) => pads.children[Number(key) - 1];
      addEventListener('keydown', (event) => { const pad = padFor(event.key); if (pad && !event.repeat && !event.metaKey && !event.ctrlKey) { begin(); flows.noteOn(riff[event.key - 1], 0.9); pad.setAttribute('aria-pressed', 'true'); } });
      addEventListener('keyup', (event) => { const pad = padFor(event.key); if (pad) { flows.noteOff(riff[event.key - 1]); pad.setAttribute('aria-pressed', 'false'); } });

      // Sliders from params(): any parameter works; these two shape the bite.
      for (const [key, name] of [['bite.resonance', 'Bite'], ['grit.drive', 'Grit'], ['amp.R', 'Tail']]) {
        const p = flows.param(key);
        if (!p) continue;
        const label = document.createElement('label');
        label.innerHTML = `<span>${name}</span><input type="range"><output></output>`;
        const input = label.querySelector('input'), output = label.querySelector('output');
        Object.assign(input, { min: p.min, max: p.max, step: p.step, value: p.value });
        output.textContent = formatValue(p, p.value);
        input.addEventListener('input', () => { output.textContent = formatValue(p, flows.setParam(key, Number(input.value))); });
        sliders.append(label);
      }

      // Our own visual from the analyser: amber bars, lilac peak line.
      const canvas = document.querySelector('canvas'), context = canvas.getContext('2d');
      const analyser = flows.analyser({ size: 2048 });
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      let last = 0;
      const draw = (time) => {
        requestAnimationFrame(draw);
        if (reduced.matches && time - last < 120) return;
        last = time;
        const ratio = devicePixelRatio || 1, width = canvas.clientWidth * ratio, height = canvas.clientHeight * ratio;
        if (canvas.width !== width || canvas.height !== height) Object.assign(canvas, { width, height });
        context.clearRect(0, 0, width, height);
        const bins = analyser.spectrum(), rate = flows.context?.sampleRate ?? 48000, bars = 48;
        for (let i = 0; i < bars; i++) {
          const frequency = 30 * Math.pow(4000 / 30, i / bars);
          const db = bins[Math.round(frequency / (rate / 2) * bins.length)] ?? -120;
          const level = Math.max(0, Math.min(1, (db + 95) / 75));
          const x = (i / bars) * width, w = width / bars - 3 * ratio;
          context.fillStyle = '#f2a541';
          context.globalAlpha = 0.25 + level * 0.75;
          const bar = Math.max(3 * ratio, level * height * 0.9);
          context.fillRect(x, height - bar, w, bar);
        }
        context.globalAlpha = 1;
      };
      requestAnimationFrame(draw);
    } catch (problem) {
      error.hidden = false;
      error.textContent = `The instrument could not load: ${problem.message}`;
    }
  </script>
</body>
</html>
