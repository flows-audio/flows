name: Publish macOS preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching VERSION
        required: true
        default: v1.1.4
        type: string
      publish:
        description: Publish the verified package as a GitHub release (otherwise artifacts only)
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      tested_commit: ${{ steps.release_tag.outputs.commit }}
    env:
      FLOWS_RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Verify exact release tag
        id: release_tag
        shell: bash
        run: |
          test "$FLOWS_RELEASE_TAG" = "v$(cat VERSION)"
          git show-ref --verify "refs/tags/$FLOWS_RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$FLOWS_RELEASE_TAG^{commit}")"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned JUCE
        run: |
          git clone --branch 8.0.7 --depth 1 https://github.com/juce-framework/JUCE.git ../JUCE
          test "$(git -C ../JUCE rev-parse HEAD)" = "10a589619b452c261b2940767eb253171eb5a823"
      - run: npm ci --prefix ui
      - run: npm audit --prefix ui --audit-level=high
      - name: Verify dependency notices
        run: |
          python3 tools/collect_licenses.py --juce-dir ../JUCE
          git diff --exit-code
      - run: cmake --preset app -DJUCE_DIR="$PWD/../JUCE" -DCMAKE_OSX_ARCHITECTURES=arm64
      - run: cmake --build --preset app --parallel 2
      - name: Test release build
        run: ctest --preset app -E 'window_startup|editor_layout' --output-junit results.xml
      - name: Package app, plugins and corresponding source
        run: python3 tools/package_macos.py --juce-dir ../JUCE --tag "$FLOWS_RELEASE_TAG"
      - name: Prepare source attachments and checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          version = Path('VERSION').read_text().strip()
          output = Path('dist')
          bundle = output / f'Flows-{version}-macOS-arm64'
          assets = [output / f'Flows-{version}-macOS-arm64.zip']
          for name in (f'Flows-{version}-source.tar.gz', 'JUCE-8.0.7-source.tar.gz'):
              target = output / name
              shutil.copyfile(bundle / name, target)
              assets.append(target)
          (output / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
              for p in assets))
          PY
      - name: Preserve release test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics
          path: |
            build-app/results.xml
            build-app/Testing/Temporary/*.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Store tested package and release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            .github/RELEASE_NOTES.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tested_commit: ${{ steps.release_tag.outputs.commit }}
    env:
      FLOWS_RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Verify exact release tag
        id: release_tag
        run: |
          test "$FLOWS_RELEASE_TAG" = "v$(cat VERSION)"
          git show-ref --verify "refs/tags/$FLOWS_RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$FLOWS_RELEASE_TAG^{commit}")"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch and verify pinned Emscripten
        run: bash .github/scripts/fetch-emsdk.sh
      - name: Native reference outputs
        run: |
          cmake --preset dev
          cmake --build --preset dev --target flows conformance_runner --parallel 2
          ./build/conformance_runner --repo "$PWD" --out build/conformance/native.json
      - run: >-
          emcmake cmake --preset web
          -DFLOWS_NATIVE_CLI="$PWD/build/flows"
          -DFLOWS_NATIVE_CONFORMANCE="$PWD/build/conformance/native.json"
      - run: cmake --build --preset web --parallel 2
      - run: ctest --preset web --output-junit results.xml
      - run: npm ci --prefix ui
      - run: npm audit --prefix ui --audit-level=high
      - run: npm run build:web --prefix ui
      - name: Verify browser notices
        run: |
          python3 tools/collect_licenses.py --emscripten-dir "$EMSCRIPTEN_ROOT"
          git diff --exit-code
      - name: Browser tests
        working-directory: ui
        env:
          CI: "true"
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:web
      - name: Package the static site with license and source notices
        run: |
          python3 tools/package_web.py --tag "$FLOWS_RELEASE_TAG"
          (cd dist && sha256sum Flows-*-web.zip > SHA256SUMS-web.txt)
      - name: Store tested site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-site
          path: |
            dist/Flows-*-web.zip
            dist/SHA256SUMS-web.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: [build, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      FLOWS_RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download artifacts from this successful build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-preview
      - name: Download the tested browser site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-site
          path: dist
      - name: Verify package checksums
        working-directory: dist
        env:
          WEB_COMMIT: ${{ needs.web.outputs.tested_commit }}
          MACOS_COMMIT: ${{ needs.build.outputs.tested_commit }}
        run: |
          test "$WEB_COMMIT" = "$MACOS_COMMIT"
          sha256sum --check SHA256SUMS.txt
          sha256sum --check SHA256SUMS-web.txt
          cat SHA256SUMS-web.txt >> SHA256SUMS.txt
      - name: Upload verified artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_COMMIT: ${{ needs.build.outputs.tested_commit }}
        run: |
          verify_remote_tag() {
            remote_commit=$(git ls-remote "https://github.com/$GH_REPO.git" \
              "refs/tags/$FLOWS_RELEASE_TAG" "refs/tags/$FLOWS_RELEASE_TAG^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1; next } { direct=$1 } END { print peeled ? peeled : direct }')
            test -n "$TESTED_COMMIT"
            if [[ "$remote_commit" != "$TESTED_COMMIT" ]]; then
              echo "Release tag no longer matches the tested commit." >&2
              exit 1
            fi
          }
          verify_remote_tag
          if ! gh release view "$FLOWS_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$FLOWS_RELEASE_TAG" --verify-tag --draft \
              --title "Flows ${FLOWS_RELEASE_TAG#v} — macOS preview" \
              --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$FLOWS_RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          verify_remote_tag
          gh release edit "$FLOWS_RELEASE_TAG" --draft=false --latest \
            --title "Flows ${FLOWS_RELEASE_TAG#v} — macOS preview" \
            --notes-file .github/RELEASE_NOTES.md
